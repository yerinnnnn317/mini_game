<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30초 생존 미니게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    #app {
      width: 100%;
      max-width: 940px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header { text-align: center; }
    h1 { font-size: 26px; margin-bottom: 4px; }
    
    .info-box {
      background: #eef2f7;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.4;
    }
    #status-display {
      font-weight: bold;
      font-size: 18px;
      color: #0056b3;
      text-align: center;
      padding: 10px;
      background: #e1f0ff;
      border-radius: 6px;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .setting-group { display: flex; align-items: center; gap: 6px; }

    canvas {
      background: #1e1e24;
      border-radius: 8px;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 580;
      display: block;
      cursor: pointer;
    }

    .btn-group { display: flex; gap: 8px; justify-content: center; }
    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .btn-primary { background: #28a745; color: white; }
    .btn-primary:hover { background: #218838; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #dc3545; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background: #bd2130; }

    .record-section {
      font-size: 12px;
      border-top: 10px solid #f0f2f5;
      padding-top: 10px;
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .record-list {
      max-height: 120px;
      overflow-y: auto;
      background: #f8f9fa;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <h1>30초 생존 미니게임</h1>
  </header>

  <div class="info-box">
    <strong>규칙:</strong> 30초간 떨어지는 장애물을 피하세요. (30초 성공 / 충돌 시 실패)<br>
    <strong>조작:</strong> 키보드 [← / →] 또는 화면 좌/우 클릭 (모바일 터치 지원)
  </div>

  <div id="status-display">상태: 시작 대기 중 | 남은 시간: 30초</div>

  <div class="controls-panel">
    <div class="setting-group">
      <label for="speed-select"><strong>난이도(속도):</strong></label>
      <select id="speed-select">
        <option value="3">쉬움 (속도 3)</option>
        <option value="5" selected>보통 (속도 5)</option>
        <option value="8">어려움 (속도 8)</option>
      </select>
    </div>
    <div class="setting-group">
      <label><input type="checkbox" id="mute-toggle"> 효과음 음소거</label>
    </div>
    <div class="setting-group">
      <label><input type="checkbox" id="effect-toggle" checked> 충돌 붉은 이펙트</label>
    </div>
  </div>

  <canvas id="gameCanvas" width="900" height="580"></canvas>

  <div class="btn-group">
    <button id="start-btn" class="btn-primary">게임 시작 / 재시작</button>
    <button id="pause-btn" class="btn-secondary">일시정지</button>
  </div>

  <div class="record-section">
    <div class="record-header">
      <strong>누적 기록 (보존 데이터 - 재접속 시 유지):</strong>
      <button id="reset-history-btn" class="btn-danger">기록 리셋</button>
    </div>
    <div id="record-list" class="record-list">기록 없음</div>
  </div>
</div>

<script>
  const playerImage = new Image();
  playerImage.src = 'player.png';

  const obstacleImage = new Image();
  obstacleImage.src = 'obstacle.jpg';

  playerImage.onload = () => { draw(); };
  obstacleImage.onload = () => { draw(); };

  const STORAGE_KEY = 'mini_game_history_v1';
  let playHistory = [];

  // [카드 4 - T02-C24, C25] 빈 값 및 손상 저장값 안전 복구
  function loadHistory() {
    try {
      const rawData = localStorage.getItem(STORAGE_KEY);
      if (rawData) {
        const parsed = JSON.parse(rawData);
        if (Array.isArray(parsed)) {
          // 배열 구조 검증
          playHistory = parsed.filter(item => 
            item && typeof item === 'object' && item.date && item.result !== undefined
          );
        } else {
          playHistory = [];
        }
      } else {
        playHistory = [];
      }
    } catch (e) {
      playHistory = []; // 손상된 JSON 읽기 실패 시 초기화로 자동 복구
    }
    renderRecords();
  }

  function saveRecord(result, speed, time) {
    playHistory.unshift({
      date: new Date().toLocaleTimeString(),
      result: result,
      speed: speed,
      time: time
    });
    if (playHistory.length > 20) playHistory.pop();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(playHistory));
    } catch (e) {}
    renderRecords();
  }

  function clearHistory() {
    if (confirm("정말로 모든 누적 기록을 삭제하시겠습니까?")) {
      playHistory = [];
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      renderRecords();
    }
  }

  function renderRecords() {
    const listEl = document.getElementById('record-list');
    if (!playHistory || playHistory.length === 0) {
      listEl.innerHTML = '기록 없음';
      return;
    }
    listEl.innerHTML = playHistory.map((r, i) => 
      `[${i+1}] ${r.date} | 난이도:${r.speed} | 결과:${r.result} | 시간:${r.time}초`
    ).join('<br>');
  }

  // [카드 5 - T02-C27] 음소거 즉시 반영
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq, type, duration) {
    const muteToggle = document.getElementById('mute-toggle');
    if (muteToggle.checked) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status-display');
  const startBtn = document.getElementById('start-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const resetHistoryBtn = document.getElementById('reset-history-btn');
  const speedSelect = document.getElementById('speed-select');
  const effectToggle = document.getElementById('effect-toggle');

  let gameState = 'STOPPED'; // STOPPED, RUNNING, PAUSED, SUCCESS, FAILED
  let player = { x: 414, y: 480, w: 70, h: 80, speed: 10 };
  let obstacles = [];
  let timer = 30;
  let lastTime = 0;
  let timerAccumulator = 0;
  let obstacleAccumulator = 0;
  let animFrameId = null;
  let hitEffectTimer = 0;

  let keys = {};

  // [카드 2 - T02-C12] 키 중복 동작 예방 및 제어
  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  // [카드 2 - T02-C13] 창 크기 변경 및 해상도 대응 반응형 클릭/터치 영역
  function handleInputAt(clientX) {
    if (gameState !== 'RUNNING') return;
    const rect = canvas.getBoundingClientRect();
    const clickX = clientX - rect.left;
    const scaleX = canvas.width / rect.width;
    const gameX = clickX * scaleX;
    
    if (gameX < canvas.width / 2) {
      player.x = Math.max(0, player.x - 60);
    } else {
      player.x = Math.min(canvas.width - player.w, player.x + 60);
    }
  }

  canvas.addEventListener('click', (e) => handleInputAt(e.clientX));
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length > 0) handleInputAt(e.touches[0].clientX);
  }, { passive: true });

  // [카드 2 - T02-C14] 포커스 이탈 시 일시정지
  window.addEventListener('blur', () => {
    if (gameState === 'RUNNING') pauseGame();
  });

  function resetGame() {
    player.x = canvas.width / 2 - player.w / 2;
    obstacles = [];
    timer = 30;
    timerAccumulator = 0;
    obstacleAccumulator = 0;
    hitEffectTimer = 0;
    lastTime = performance.now();
  }

  // [카드 1 - T02-C08, C09] 성공/실패 후 재시작 시 완전 초기화
  function startGame() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    resetGame();
    gameState = 'RUNNING';
    statusEl.innerText = `상태: 진행 중 | 남은 시간: 30초`;
    pauseBtn.innerText = '일시정지';
    
    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = requestAnimationFrame(gameLoop);
  }

  // [카드 2 - T02-C15] 일시정지 및 재개 처리
  function pauseGame() {
    if (gameState === 'RUNNING') {
      gameState = 'PAUSED';
      statusEl.innerText = `상태: 일시정지 | 남은 시간: ${timer}초`;
      pauseBtn.innerText = '재개';
    } else if (gameState === 'PAUSED') {
      gameState = 'RUNNING';
      statusEl.innerText = `상태: 진행 중 | 남은 시간: ${timer}초`;
      pauseBtn.innerText = '일시정지';
      lastTime = performance.now();
      animFrameId = requestAnimationFrame(gameLoop);
    }
  }

  function endGame(isSuccess) {
    gameState = isSuccess ? 'SUCCESS' : 'FAILED';
    const obstacleSpeed = speedSelect.value;
    const elapsed = 30 - timer;

    if (isSuccess) {
      statusEl.innerText = '상태: 성공! 30초 생존 완료 🎉';
      playBeep(600, 'sine', 0.3);
      saveRecord('성공', obstacleSpeed, 30);
    } else {
      statusEl.innerText = '상태: 실패! 장애물 충돌 💥';
      if (effectToggle.checked) hitEffectTimer = 10;
      playBeep(150, 'sawtooth', 0.4);
      saveRecord('실패', obstacleSpeed, elapsed);
    }
    draw();
  }

  function gameLoop(now) {
    if (gameState !== 'RUNNING') return;

    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (keys['ArrowLeft'] && player.x > 0) {
      player.x -= player.speed;
    }
    if (keys['ArrowRight'] && player.x < canvas.width - player.w) {
      player.x += player.speed;
    }

    timerAccumulator += dt;
    if (timerAccumulator >= 1.0) {
      timer--;
      timerAccumulator -= 1.0;
      statusEl.innerText = `상태: 진행 중 | 남은 시간: ${timer}초`;
      playBeep(440, 'square', 0.05);

      if (timer <= 0) {
        endGame(true);
        return;
      }
    }

    const spawnInterval = 0.4 / (parseFloat(speedSelect.value) / 5);
    obstacleAccumulator += dt;
    if (obstacleAccumulator >= spawnInterval) {
      obstacleAccumulator = 0;
      
      const baseHeight = 70;
      let obsWidth = baseHeight;
      let obsHeight = baseHeight;

      if (obstacleImage.complete && obstacleImage.naturalWidth > 0) {
        const aspectRatio = obstacleImage.naturalWidth / obstacleImage.naturalHeight;
        obsWidth = baseHeight * aspectRatio;
      }
      
      obstacles.push({
        x: Math.random() * (canvas.width - obsWidth),
        y: -obsHeight,
        w: obsWidth,
        h: obsHeight,
        speed: parseFloat(speedSelect.value) * 60 + Math.random() * 60
      });
    }

    for (let i = 0; i < obstacles.length; i++) {
      let obs = obstacles[i];
      obs.y += obs.speed * dt;

      if (
        player.x < obs.x + obs.w &&
        player.x + player.w > obs.x &&
        player.y < obs.y + obs.h &&
        player.y + player.h > obs.y
      ) {
        endGame(false);
        return;
      }
    }

    obstacles = obstacles.filter(obs => obs.y < canvas.height);

    draw();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1e1e24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (hitEffectTimer > 0 && effectToggle.checked) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      hitEffectTimer--;
    }

    if (playerImage.complete && playerImage.naturalWidth !== 0) {
      const pRatio = playerImage.naturalWidth / playerImage.naturalHeight;
      const pWidth = player.h * pRatio;
      player.w = pWidth;
      ctx.drawImage(playerImage, player.x, player.y, pWidth, player.h);
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }

    for (let obs of obstacles) {
      if (obstacleImage.complete && obstacleImage.naturalWidth !== 0) {
        ctx.drawImage(obstacleImage, obs.x, obs.y, obs.w, obs.h);
      } else {
        ctx.fillStyle = '#dc3545';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }
    }
  }

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', pauseGame);
  resetHistoryBtn.addEventListener('click', clearHistory);

  loadHistory();
  draw();
</script>

</body>
</html>
